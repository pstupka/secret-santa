# Checks every push to master, then builds the production image and pushes it
# to GHCR. Deploying stays manual on the VPS (README.md, "Deployment").
name: Image

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/pstupka/secret-santa

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Server
        run: |
          yarn workspace @secret-santa/server lint
          yarn workspace @secret-santa/server prettier
          yarn workspace @secret-santa/server typecheck
          yarn workspace @secret-santa/server test
      - name: Client
        run: |
          yarn workspace @secret-santa/client lint
          yarn workspace @secret-santa/client prettier
          yarn workspace @secret-santa/client typecheck
          yarn workspace @secret-santa/client test

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # the VPS's architecture
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Links the package to this repo, so it takes the repo's (public) visibility.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
