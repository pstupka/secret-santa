# Production stack on the VPS: the app behind the host's reverse proxy (Apache),
# which terminates TLS and forwards to 127.0.0.1:8080. CI pushes the image to
# GHCR on every push to master (.github/workflows/image.yml); on the VPS, as
# compose.yaml next to .env:
#   docker compose pull && docker compose up -d --wait
# See README.md, "Deployment".

# Fixed project name, so the volume stays secret-santa_santa-data whatever the
# folder on the VPS is called.
name: secret-santa

# Shared by every service running the app image (app, and cron with its own
# command on the same /data volume).
x-app: &app
  # A commit SHA pins a version (rollback): IMAGE_TAG=<sha> docker compose up -d
  image: ghcr.io/pstupka/secret-santa:${IMAGE_TAG:-latest}
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_PATH: /data/secret-santa.db
  volumes:
    - santa-data:/data
  restart: unless-stopped

services:
  app:
    <<: *app
    # Published on loopback only: the host's reverse proxy reaches it, the
    # internet does not.
    ports:
      - '127.0.0.1:8080:8080'

  # Daily retention and backups (server/src/jobs/daily.ts) at 03:00 UTC, see
  # crontab. Same image and /data volume as the app; backups go to
  # /data/backups and, when BACKUP_RCLONE_REMOTE is set, offsite via rclone.
  cron:
    <<: *app
    depends_on:
      - app
    command: ['supercronic', '/app/crontab']
    # The image's HEALTHCHECK probes the HTTP server, which this service lacks.
    healthcheck:
      disable: true

volumes:
  santa-data:
